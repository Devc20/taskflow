<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">TaskFlow</h1>
      <p class="app__subtitle">Gestiona tus tareas pendientes en un solo lugar.</p>
    </header>

    <form id="task-form" class="task-form">
      <input
        id="task-input"
        class="task-form__input"
        type="text"
        placeholder="¿Qué necesitas hacer?"
        autocomplete="off"
        required
      >
      <button class="task-form__button" type="submit">Agregar</button>
    </form>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-state" class="empty-state">Aún no tienes tareas. Agrega la primera.</p>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
